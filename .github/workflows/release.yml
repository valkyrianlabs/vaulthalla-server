name: Release Pipeline

# Releases are cut with vl-release: `vlr cut patch|minor|major|X.Y.Z --push` bumps, commits and tags; the `v*` tag
# push starts this workflow. Release semantics live in `vlr` commands (release.toml, `vlr help ci`); this file only
# provides triggers, runners, credentials and job ordering. See .claude/context/release-pipeline.md.
#
# Transaction: check -> verify -> prepare + build + validate (artifact) -> publish APT -> GitHub release -> finalize.
# `vlr prepare` promotes .release/*_NEXT.md into debian/changelog + RELEASE_NOTES.md in each job's work tree only
# (deterministic); `vlr finalize` commits that history to main only after every publication succeeded. A failed run
# leaves the repository untouched and can be re-run ("Re-run failed jobs"); publication never replaces bytes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to release-check (default the selected ref).
        required: false
        type: string
      publish:
        description: Publish (requires a v* tag ref) or only build and validate.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
  push:
    tags:
      - "v*"

# Least privilege by default; jobs that write (GitHub release, finalize, docs OIDC) widen it locally.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Runners: the VPS runner (gh-vaulthalla, labels vaulthalla + vps-ci). Every run step executes in the disposable CI
# container (ci/run-ci, rootless Podman, ci/Containerfile), which carries vl-release, pmdocs, gh, shellcheck, Node/pnpm
# and the build dependencies: no host sudo, apt or Docker. The licensed icon store is mounted read-only.
env:
  RELEASE_REF: ${{ github.event.inputs.ref || github.ref }}
  DOCS_SYNC_ENDPOINT: ${{ vars.DOCS_SYNC_ENDPOINT || 'https://vaulthalla.io/api/documentation/sync' }}
  CI_CACHE_NAMES: ccache
  CI_RO_MOUNTS: /home/gh-vaulthalla/vaulthalla-web-icons:/opt/vaulthalla-web-icons
  VAULTHALLA_WEB_ICON_SRC: /opt/vaulthalla-web-icons

jobs:
  release-check:
    name: Release check
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 20
    outputs:
      version: ${{ steps.state.outputs.version }}
      tag: ${{ steps.state.outputs.tag }}
      publish_required: ${{ steps.state.outputs.publish_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check the release contract
        id: state
        env:
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish || 'dry-run' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag=""
          case "$RELEASE_REF" in
            refs/tags/*) tag="${RELEASE_REF#refs/tags/}" ;;
            v[0-9]*) tag="$RELEASE_REF" ;;
          esac
          publish_required=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "$DISPATCH_PUBLISH" = "publish" ]; then
            publish_required=true
            if [ -z "$tag" ]; then
              echo "::error::Publication requires a v* tag ref, got '${RELEASE_REF}'."
              exit 1
            fi
          fi
          if [ -n "$tag" ]; then
            vlr check --release --tag "$tag"
          else
            vlr check --release
          fi
          vlr version check
          vlr status
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "publish_required=${publish_required}"
          } >> "$GITHUB_OUTPUT"

  contracts-verify:
    name: Packaging contracts, lifecycle and lab tests, shellcheck
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: release-check
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Release contract, packaging contracts, lifecycle and lab tests
        run: bash tools/dev/verify.sh release packaging lifecycle

      - name: shellcheck (maintainer scripts blocking, bin/ advisory)
        run: bash .github/scripts/shellcheck.sh

  # Typecheck, lint and design-token checks only: release-artifacts runs the one production web build (vlr build-deb's
  # pre_build) and checks its budgets, so the release never builds the web app twice (#185).
  web-verify:
    name: Web checks
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: release-check
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # The typecheck resolves the licensed icons and logo (@/fa-*, @/public/vaulthalla-logo.png): sync them first.
      - name: Sync private web icons
        uses: ./.github/actions/sync_web_icons

      - name: Setup web toolchain
        uses: ./.github/actions/setup_web

      - name: Run web checks
        uses: ./.github/actions/test_web

  docs-validate:
    name: Documentation validation
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: release-check
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Validate documentation package
        run: pmdocs validate --source docs

  release-artifacts:
    name: Prepare, build and validate release artifacts
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - contracts-verify
      - web-verify
      - docs-validate
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Prepare release history (work tree only)
        run: vlr prepare --record release/meta/prepare.json

      - name: Build Debian package and web tarball
        run: vlr build-deb

      # The production web build pre_build just made (web/.next) is the one that ships.
      - name: Check web performance budgets
        run: pnpm --dir web budgets

      # The package is the only -O3 build in the release: no second build and no rerun of the test suite (the
      # required PR CI gate compiled and ran it at -O0). Check that the shipped binaries got the intended flags.
      - name: Check the package was compiled at -O3 with hardening and no warnings
        run: python3 tools/dev/check_build_flags.py release/build-deb.log

      - name: Checksums and artifact validation
        run: |
          set -euo pipefail
          vlr checksums
          vlr validate-artifacts
          vlr artifacts

      - name: Preview GitHub release
        run: |
          set -euo pipefail
          vlr release-title
          vlr release-body

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error

  publish-debian:
    name: Publish Debian package
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - release-artifacts
    if: needs.release-check.outputs.publish_required == 'true'
    environment: Production
    timeout-minutes: 30
    # One APT publication at a time across tags; queued, never cancelled.
    concurrency:
      group: vaulthalla-apt-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Prepare release history (deterministic re-run)
        run: vlr prepare

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/

      - name: Verify artifacts
        run: |
          set -euo pipefail
          vlr checksums --verify
          vlr validate-artifacts

      # Idempotent and sha256-verified: identical bytes already live are skipped, different bytes are refused.
      - name: Publish to the APT repository
        env:
          RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'disabled' }}
          NEXUS_APT_REPO: ${{ vars.NEXUS_APT_REPO || vars.NEXUS_REPO_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PASS }}
        run: vlr publish-deb --require-enabled

  github-release:
    name: GitHub release
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - publish-debian
    if: >-
      !cancelled() &&
      needs.release-check.outputs.publish_required == 'true' &&
      needs.publish-debian.result == 'success'
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      # vlr github-release drives the GitHub CLI, which the CI container image carries (ci/Containerfile).
      - name: Prepare release history (deterministic re-run)
        run: vlr prepare

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/

      - name: Verify artifacts
        run: vlr checksums --verify

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: vlr github-release

  # macOS: the self-contained installer package (tools/macos/pkg/), on GitHub-hosted Apple Silicon, in two jobs so
  # the slow part runs in parallel with the Debian build. macos-build compiles everything but the web console (core,
  # PostgreSQL, Caddy, Node, pdfium; libraries bundled). macos-package adds the web console from release-artifacts'
  # web bundle (only the Linux runner has the licensed icons; tools/macos/pkg/web-for-macos.sh swaps sharp's native
  # addon for darwin-arm64), builds the package, and installs it through the Homebrew cask on that clean Mac before
  # anything is published. Signed and notarized when the Developer ID secrets exist (MACOS_SIGNING_P12 +
  # MACOS_SIGNING_P12_PASSWORD holding the Application and Installer identities; MACOS_NOTARY_APPLE_ID,
  # MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD), unsigned otherwise. Neither job ever fails the APT release; re-run
  # them with "Re-run failed jobs".
  macos-build:
    name: macOS build (core, PostgreSQL, Caddy)
    runs-on: xcode-27
    needs: release-check
    if: needs.release-check.outputs.publish_required == 'true'
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Paths
        run: |
          {
            echo "VH_MACOS_DEPS=$RUNNER_TEMP/vaulthalla-macos-deps"
            echo "VH_CANDIDATE_DIR=$RUNNER_TEMP/candidate"
          } >> "$GITHUB_ENV"

      - name: Bootstrap (brew bundle, PDFium, pkg-config aliases)
        run: tools/macos/bootstrap.sh

      # Caddy for `vh setup caddy` is built with xcaddy (tools/macos/pkg/build-caddy.sh).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Stage everything but the web console
        run: |
          VH_CANDIDATE_WEB=none tools/macos/candidate.sh stage
          stage="$VH_CANDIDATE_DIR/stage"
          tools/macos/pkg/build-postgres.sh "$stage"
          tools/macos/pkg/build-caddy.sh "$stage"
          # Bundled here, where Homebrew's libraries are: the packaging job needs nothing from Homebrew.
          python3 tools/macos/pkg/bundle_dylibs.py "$stage"
          tar -C "$VH_CANDIDATE_DIR" -czf "$RUNNER_TEMP/macos-stage.tar.gz" stage stage.commit

      - uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-macos-stage-${{ needs.release-check.outputs.version }}
          path: ${{ runner.temp }}/macos-stage.tar.gz
          if-no-files-found: error
          retention-days: 3

  macos-package:
    name: macOS installer package
    runs-on: xcode-27
    needs:
      - release-check
      - release-artifacts
      - macos-build
    if: needs.release-check.outputs.publish_required == 'true'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Paths
        run: echo "VH_CANDIDATE_DIR=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: vaulthalla-macos-stage-${{ needs.release-check.outputs.version }}
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Add the release's web console
        run: |
          mkdir -p "$VH_CANDIDATE_DIR"
          tar -C "$VH_CANDIDATE_DIR" -xzf "$RUNNER_TEMP/macos-stage.tar.gz"
          web=$(find release -name "vaulthalla-web_${{ needs.release-check.outputs.version }}_next-standalone.tar.gz" | head -1)
          [ -n "$web" ] || { echo "::error::no web bundle in the release artifacts"; exit 1; }
          tools/macos/pkg/web-for-macos.sh "$web" "$VH_CANDIDATE_DIR/stage"

      - name: Signing identities (only when the secrets exist)
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::no MACOS_SIGNING_P12: the package is unsigned"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046  # the existing search list, one keychain per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          inst=$(security find-identity -v "$kc" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          echo "VH_PKG_CODESIGN_IDENTITY=$app" >> "$GITHUB_ENV"
          echo "VH_PKG_INSTALLER_IDENTITY=$inst" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ]; then
            xcrun notarytool store-credentials vaulthalla-notary --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$kc"
            echo "VH_PKG_NOTARY_PROFILE=vaulthalla-notary" >> "$GITHUB_ENV"
          fi

      - name: Build the package
        run: |
          tools/macos/candidate.sh pkg
          pkg=$(ls "$VH_CANDIDATE_DIR"/pkg/vaulthalla-*-arm64.pkg)
          [ "$(basename "$pkg")" = "vaulthalla-${{ needs.release-check.outputs.version }}-arm64.pkg" ]
          tools/macos/pkg/render-cask.sh "$pkg" > "$VH_CANDIDATE_DIR/pkg/vaulthalla.rb"
          ruby -c "$VH_CANDIDATE_DIR/pkg/vaulthalla.rb"

      # The Homebrew path on this clean Mac, before anything is published: install, use, uninstall, reinstall, zap.
      - name: Homebrew cask smoke
        run: bash tools/macos/pkg/cask-smoke.sh "$(ls "$VH_CANDIDATE_DIR"/pkg/vaulthalla-*-arm64.pkg)"

      - uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-macos-${{ needs.release-check.outputs.version }}
          path: ${{ env.VH_CANDIDATE_DIR }}/pkg/
          if-no-files-found: error

  # Attaches the package to the GitHub release, publishes it to the Nexus raw repository (NEXUS_PKG_REPO, with the APT
  # repository's credentials and RELEASE_PUBLISH_MODE gate) and updates the Homebrew cask (vaulthalla/homebrew-tap, with
  # HOMEBREW_TAP_TOKEN: contents:write on that repository; without it the cask update is skipped with a warning).
  macos-publish:
    name: Publish the macOS package
    runs-on: ubuntu-latest
    needs:
      - release-check
      - github-release
      - macos-package
    if: >-
      !cancelled() &&
      needs.github-release.result == 'success' &&
      needs.macos-package.result == 'success'
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: vaulthalla-macos-${{ needs.release-check.outputs.version }}
          path: pkg/

      # Immutable like the APT publication: identical bytes already there are skipped, different ones refused.
      - name: Publish to the Nexus package repository
        env:
          RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'disabled' }}
          NEXUS_PKG_REPO: ${{ vars.NEXUS_PKG_REPO }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PASS }}
        run: bash tools/macos/pkg/publish-nexus.sh pkg

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          set -euo pipefail
          (cd pkg && sha256sum -c "vaulthalla-$VERSION-arm64.pkg.sha256")
          gh release upload "v$VERSION" "pkg/vaulthalla-$VERSION-arm64.pkg" "pkg/vaulthalla-$VERSION-arm64.pkg.sha256" \
            --clobber -R "$GITHUB_REPOSITORY"

      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::no HOMEBREW_TAP_TOKEN: cask not updated"; exit 0; fi
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/vaulthalla/homebrew-tap.git" tap
          cp pkg/vaulthalla.rb tap/Casks/vaulthalla.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vaulthalla.rb
          if git diff --cached --quiet; then echo "cask already at $VERSION"; exit 0; fi
          git commit -q -m "vaulthalla $VERSION"
          git push -q origin HEAD:main

  finalize:
    name: Record the release on main
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - publish-debian
      - github-release
    if: >-
      !cancelled() &&
      needs.release-check.outputs.publish_required == 'true' &&
      needs.publish-debian.result == 'success' &&
      needs.github-release.result == 'success'
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      # main's ruleset requires pull requests and only lets admins bypass. vlr finalize pushes to main, so it needs
      # either GitHub Actions as a bypass actor on that ruleset, or RELEASE_FINALIZE_TOKEN (a token of a bypass actor
      # with contents:write). Without either, publication still succeeds and only this job fails; re-run it later.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_FINALIZE_TOKEN || github.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/

      - name: Prepare release history (deterministic re-run)
        run: vlr prepare

      # Commits the promoted debian/changelog + RELEASE_NOTES.md and the cleared .release/*_NEXT.md onto main,
      # verified against what was built and published. A no-op when main already records the version.
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          vlr finalize --record release/meta/prepare.json

  docs-publish:
    # Independent of finalize: a docs failure never marks a live APT release as failed. Retry with
    # "Re-run failed jobs".
    name: Publish docs
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - docs-validate
      - publish-debian
    if: >-
      !cancelled() &&
      needs.release-check.outputs.publish_required == 'true' &&
      needs.docs-validate.result == 'success' &&
      needs.publish-debian.result == 'success'
    environment: Production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Verify pmdocs
        run: |
          set -euo pipefail
          if ! command -v pmdocs >/dev/null 2>&1; then
            echo "::error::pmdocs is missing from the CI container image (ci/Containerfile)."
            exit 1
          fi
          pmdocs --version

      - name: Validate and push docs
        run: |
          set -euo pipefail
          pmdocs validate --source docs
          for attempt in 1 2 3; do
            if timeout 300 pmdocs push \
              --endpoint "${DOCS_SYNC_ENDPOINT}" \
              --source docs \
              --github-oidc \
              --publish; then
              exit 0
            fi
            echo "[docs] pmdocs push attempt ${attempt}/3 failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::pmdocs push failed after 3 attempts. The APT release is unaffected; re-run this job."
          exit 1
