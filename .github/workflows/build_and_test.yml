name: Vaulthalla CI Build
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners: pushes and pull requests from branches of this repository run on the
# Valkyrian Labs VPS build pool (label vps-ci); pull requests from forks (untrusted code that could also
# rewrite this file) run on GitHub-hosted runners, which have no licensed icon store, so their icon sync fails.
# Every run step (including the composite actions') executes in the disposable CI container (ci/run-ci,
# rootless Podman, ci/Containerfile): no host sudo, apt or Docker. ccache and the pnpm store persist in the
# runner's cache; the licensed icon store is mounted read-only and never enters the repository.
env:
  CI_CACHE_NAMES: ccache

jobs:
  # Pushes to main skip the build when CI already tested the exact tree they land: a merged, up-to-date pull request,
  # or a `vlr cut` release commit (release.yml builds it) on a tested parent. Direct pushes always build. The gate
  # runs on a GitHub-hosted runner (seconds, no VPS slot) and fails open. `vlr finalize` commits carry [skip ci]
  # (release.toml), so they never start this workflow. See .github/scripts/ci_gate.py (#185).
  gate:
    name: Decide whether this push needs CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Cone mode always includes top-level files: the gate reads release.toml's version files.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_gate.py

  # build, web and tooling are independent jobs that run side by side (the vps-ci pool has three runners, one per job), so
  # a pull request waits for the slowest of them, not their sum. The ruleset requires `build` and the tooling job; `web`
  # (formerly steps of `build`) is added to it.
  build:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(format('["self-hosted","Linux","X64","{0}"]', vars.CI_HEAVY_LABEL || 'ci-heavy')) }}
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner
        with:
          test: 'true'

  web:
    name: Web console (typecheck, lint, build, budgets)
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","vps-ci"]') }}
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 30
    # Only the web job needs the licensed icon store (mounted read-only; VPS runners only).
    env:
      CI_RO_MOUNTS: /opt/ci/vaulthalla-web-icons:/opt/vaulthalla-web-icons
      VAULTHALLA_WEB_ICON_SRC: /opt/vaulthalla-web-icons
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner
        with:
          build: 'false'
          build_web: 'true'
          test_web: 'true'

  tooling:
    name: Release contract, packaging contracts, lifecycle and lab tests, shellcheck
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","vps-ci"]') }}
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # vl-release, pmdocs and shellcheck come with the CI container image.
      - name: Release contract, packaging contracts, lifecycle and lab tests
        run: bash tools/dev/verify.sh release packaging lifecycle

      - name: shellcheck (maintainer scripts blocking, bin/ advisory)
        run: bash .github/scripts/shellcheck.sh

      # The integration engine's unit and self tests: no daemon, no privileges (tools/harness).
      - name: Integration engine tests (tools/harness)
        run: |
          python3.14 -m venv "$RUNNER_TEMP/harness-venv"
          "$RUNNER_TEMP/harness-venv/bin/pip" install -q -r tools/harness/requirements.txt
          VERIFY_HARNESS_PYTHON="$RUNNER_TEMP/harness-venv/bin/python" bash tools/dev/verify.sh harness

      # The WebAuthn libFuzzer targets always build (a few files). They run for their 60 s budget when the change can
      # affect them (decision D5: the parsers are fuzzed on every change to them) and on every push to main; other pull
      # requests stop after the build. It shares this job because the vps-ci pool has three runners: a fourth job per
      # pull request would queue behind the other three.
      - name: WebAuthn fuzz (build; 60 s per target when relevant)
        uses: ./.github/actions/fuzz
