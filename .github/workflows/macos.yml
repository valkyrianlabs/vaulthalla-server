name: macOS
# Builds core/ on Apple Silicon with Homebrew deps and runs vh_unit_tests without a database, as Linux CI does: the
# DB-backed suites skip (no VH_TEST_DB_*). They are manual validation (`make test`, tools/macos/test-db.sh), never CI:
# a Postgres cluster plus ~850 DB cases took ~10 of the job's minutes on hosted Macs. On manual dispatch it also
# builds the installer package (tools/macos/pkg/) as an artifact. Runs in parallel with the Linux CI (ci/run-ci
# containers, self-hosted runners); nothing here publishes (release.yml does).
# Failures are real, never masked.
on:
  pull_request:
    paths:
      - 'core/**'
      - 'meson*'
      - 'tools/macos/**'
      - 'deploy/launchd/**'
      - '.github/workflows/macos.yml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'meson*'
      - 'tools/macos/**'
      - 'deploy/launchd/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      nexus_test:
        description: 'Also publish the rehearsal package to Nexus from the VPS runner (delete it there afterwards)'
        type: boolean
        default: false
      nexus_upload_check:
        description: 'Only check the Nexus upload path: publish a 120 MB dummy package (no build); delete it afterwards'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ccache (meson uses it when it's on PATH at setup). The unity test objects use a precompiled header: clang's PCH
  # timestamp and the PCH defines would otherwise make every one of them a miss.
  CCACHE_DIR: /Users/runner/Library/Caches/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_MAXSIZE: 3G
  CXXFLAGS: -Xclang -fno-pch-timestamp
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ENV_HINTS: '1'

jobs:
  # Pushes to main skip the build when the merged pull request's run of this workflow already built and tested the
  # exact tree (the Linux CI's gate, .github/scripts/ci_gate.py, pointed at this workflow). Direct pushes build.
  gate:
    name: Decide whether this push needs CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CI_GATE_WORKFLOW: macos.yml
          CI_GATE_JOB: Build and unit tests (macOS arm64)
        run: python3 .github/scripts/ci_gate.py

  build-and-test:
    name: Build and unit tests (macOS arm64)
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    # GitHub-hosted Apple Silicon on macOS 27 (the `xcode-27` image, public preview; there is no macos-27 label yet),
    # matching the maintainer's macOS 27 hosts. macos-26 is the fallback label if the preview image misbehaves.
    runs-on: xcode-27
    timeout-minutes: 90
    continue-on-error: false
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      # Outside the checkout; the runner context is not available to workflow- or job-level env.
      - name: Deps prefix
        run: echo "VH_MACOS_DEPS=$RUNNER_TEMP/vaulthalla-macos-deps" >> "$GITHUB_ENV"

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/macos/Brewfile') }}
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      # The prefix only holds the pinned PDFium SDK (fetch-pdfium.sh skips a matching install; the key tracks its pin) and generated .pc aliases.
      - name: Cache PDFium prefix
        uses: actions/cache@v4
        with:
          path: ${{ env.VH_MACOS_DEPS }}
          key: macos-deps-${{ runner.arch }}-${{ hashFiles('tools/macos/fetch-pdfium.sh') }}

      # A new key every run (caches are immutable); restore takes the newest one from this branch, else main's.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ccache-macos-debug-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-debug-${{ runner.arch }}-

      - name: Bootstrap (brew bundle, PDFium, pkg-config aliases)
        run: tools/macos/bootstrap.sh

      - name: Toolchain
        run: |
          . tools/macos/env.sh
          sw_vers
          clang++ --version
          meson --version
          for m in openssl libcurl libpqxx-vh pdfium gtest; do printf '%-12s %s\n' "$m" "$(pkg-config --modversion "$m")"; done

      - name: meson setup
        run: |
          . tools/macos/env.sh
          meson setup build-macos -Dwerror=true -Dbuild_unit_tests=true -Ddb_tests=false -Dmanpage=true 2>&1 | tee "$RUNNER_TEMP/meson-setup.log"

      - name: meson compile
        run: |
          . tools/macos/env.sh
          ccache -z >/dev/null
          # Progress only, as on Linux: any warning, note or chatter fails the build (AGENTS.md).
          bash tools/dev/quiet-build.sh build-macos "$RUNNER_TEMP/meson-setup.log"
          ccache -s

      - name: meson test
        run: |
          . tools/macos/env.sh
          meson test -C build-macos --print-errorlogs

      - name: Upload meson logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-meson-logs
          path: |
            build-macos/meson-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Not part of PR CI: release.yml builds the package (in parallel with the Debian build) for every release. Run this
  # workflow by hand (Actions > macOS > Run workflow) to rehearse a package from any branch.
  package:
    name: Installer package (macOS arm64)
    needs: gate
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.nexus_upload_check }}
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Deps prefix
        run: |
          {
            echo "VH_MACOS_DEPS=$RUNNER_TEMP/vaulthalla-macos-deps"
            echo "VH_CANDIDATE_DIR=$RUNNER_TEMP/candidate"
          } >> "$GITHUB_ENV"

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/macos/Brewfile') }}
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache PDFium prefix
        uses: actions/cache@v4
        with:
          path: ${{ env.VH_MACOS_DEPS }}
          key: macos-deps-${{ runner.arch }}-${{ hashFiles('tools/macos/fetch-pdfium.sh') }}

      # The PostgreSQL build is pinned by version and sha256 in build-postgres.sh.
      - name: Cache PostgreSQL build
        uses: actions/cache@v4
        with:
          path: ~/.cache/vaulthalla-macos-pkg
          key: macos-postgres-${{ runner.arch }}-${{ hashFiles('tools/macos/pkg/build-postgres.sh') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ccache-macos-release-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-release-${{ runner.arch }}-

      - name: Bootstrap (brew bundle, PDFium, pkg-config aliases)
        run: tools/macos/bootstrap.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # GitHub's Macs don't have the licensed icon set, so the console comes from the latest release's web bundle
      # (built on the Linux runner), as release.yml takes it from release-artifacts.
      - name: Web bundle (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'vaulthalla-web_*_next-standalone.tar.gz' --dir "$RUNNER_TEMP/web"
          echo "VH_CANDIDATE_WEB_TARBALL=$(ls "$RUNNER_TEMP"/web/vaulthalla-web_*_next-standalone.tar.gz)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Stage (release build, web console from the bundle, Node runtime, pdfium)
        run: tools/macos/candidate.sh stage

      - name: Build the package
        run: tools/macos/candidate.sh pkg

      - name: Package contents
        run: |
          pkg=$(ls "$VH_CANDIDATE_DIR"/pkg/vaulthalla-*-arm64.pkg)
          pkgutil --payload-files "$pkg" | grep -E '/(bin|LaunchDaemons|libexec/vaulthalla/postgresql/bin)/' | head -40
          tools/macos/pkg/render-cask.sh "$pkg" > "$VH_CANDIDATE_DIR/pkg/vaulthalla.rb"
          ruby -c "$VH_CANDIDATE_DIR/pkg/vaulthalla.rb"

      # The Homebrew path on this clean Mac: install through the release cask, use it, uninstall, reinstall, zap.
      - name: Homebrew cask smoke (install, use, uninstall, zap)
        run: |
          pkg=$(ls "$VH_CANDIDATE_DIR"/pkg/vaulthalla-*-arm64.pkg)
          bash tools/macos/pkg/cask-smoke.sh "$pkg"

      - name: Diagnostics
        if: failure()
        run: |
          sudo grep -E 'vaulthalla|preinstall|postinstall|PackageKit: Install' /var/log/install.log | tail -n 80 || true
          sudo sh -c 'tail -n 60 /Library/Logs/Vaulthalla/*.log' || true

      - uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-macos-pkg
          path: ${{ env.VH_CANDIDATE_DIR }}/pkg/
          if-no-files-found: error
          retention-days: 14

  # Nexus is published to from the VPS runner, straight to Nexus on its loopback (pkg.vaulthalla.sh serves the
  # read-only group vaulthalla-raw; uploads go to its hosted member), in the CI container sharing the host's network,
  # as release.yml's macos-publish-nexus does. Only on manual runs; delete what these publish afterwards.
  nexus-publish-rehearsal:
    name: Nexus publish (rehearsal package)
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.nexus_test && needs.package.result == 'success'
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 15
    env:
      CI_NETWORK: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vaulthalla-macos-pkg
          path: pkg/
      - name: Publish
        env:
          RELEASE_PUBLISH_MODE: nexus
          NEXUS_PKG_REPO: ${{ vars.NEXUS_PKG_UPLOAD_URL || 'http://127.0.0.1:8081/repository/vaulthalla-raw-hosted' }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PASS }}
        run: bash tools/macos/pkg/publish-nexus.sh pkg

  # The upload path alone (credentials, size, readback, the identical/different-bytes rules), with a dummy package
  # larger than a real one: no build.
  nexus-upload-check:
    name: Nexus upload check (dummy package)
    if: github.event_name == 'workflow_dispatch' && inputs.nexus_upload_check
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 15
    env:
      CI_NETWORK: host
    steps:
      - uses: actions/checkout@v4
      - name: A 120 MB dummy package
        run: |
          mkdir -p dummy-pkg && cd dummy-pkg
          head -c 125829120 /dev/urandom > vaulthalla-0.0.0-uploadcheck-arm64.pkg
          sha256sum vaulthalla-0.0.0-uploadcheck-arm64.pkg > vaulthalla-0.0.0-uploadcheck-arm64.pkg.sha256
      - name: "Publish it, then again (identical bytes must be skipped)"
        env:
          RELEASE_PUBLISH_MODE: nexus
          NEXUS_PKG_REPO: ${{ vars.NEXUS_PKG_UPLOAD_URL || 'http://127.0.0.1:8081/repository/vaulthalla-raw-hosted' }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PASS }}
        run: |
          bash tools/macos/pkg/publish-nexus.sh dummy-pkg
          bash tools/macos/pkg/publish-nexus.sh dummy-pkg
          rm -rf dummy-pkg
