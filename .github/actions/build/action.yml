name: 'Build Project'
description: 'Compiles the project.'
# The PR correctness gate: the full test suite is compiled and run at -O0 (buildtype=debug) with -Werror. Release
# packages are built once, at -O3, by debian/rules (vlr build-deb); release CI doesn't rebuild or re-test here.
# Every step runs in the disposable CI container (ci/run-ci, ci/Containerfile): the build dependencies are baked
# into the image, ccache lives in the runner's persistent cache (CI_CACHE_NAMES=ccache, /cache/ccache), and
# `sudo meson install` only touches the container.
inputs:
  build_type:
    description: Meson buildtype (debug = -O0, the CI test configuration).
    default: debug
    required: false
runs:
  using: "composite"
  # No checkout here: callers already checked out the ref under test (release.yml honors the
  # workflow_dispatch `ref` input). A nested checkout would silently reset the workspace to github.sha.
  steps:
    - name: Sync private web icons
      uses: ./.github/actions/sync_web_icons
    - name: Make clean
      shell: bash ./ci/run-ci bash -euo pipefail {0}
      run: make clean || true
    - name: Show ccache stats
      shell: bash ./ci/run-ci bash -euo pipefail {0}
      run: ccache -s
    - name: Build
      shell: bash ./ci/run-ci bash -euo pipefail {0}
      run: |
        meson setup build --buildtype=${{ inputs.build_type }} -Dwerror=true -Dbuild_unit_tests=true -Dinstall_data=false
        # The container's memory limit (ci/run-ci --memory; /proc/meminfo shows the host's, not ours) bounds the jobs:
        # a unity test object takes up to ~2.5 GB in GCC, and ninja's default (cores + 2) overran the old 12g limit.
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
        cores=$(nproc)
        if [ "$limit" = max ]; then jobs=$cores; else jobs=$(( limit / 2500000000 )); fi
        [ "$jobs" -ge 1 ] || jobs=1; [ "$jobs" -le "$cores" ] || jobs=$cores
        echo "compile jobs: $jobs (cores $cores, container memory limit $limit)"
        meson compile -C build -j "$jobs"
        sudo meson install -C build
        sudo ldconfig
