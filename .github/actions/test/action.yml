name: 'Run C++ Tests'
description: 'Runs compiled binary tests.'
runs:
  using: "composite"
  steps:
    - name: Run Tests
      shell: bash ./ci/run-ci bash -euo pipefail {0}
      run: |
        export PATH_TO_TEST_DATA="$GITHUB_WORKSPACE/test-assets"
        echo "Using test data path $PATH_TO_TEST_DATA"
        # vh_unit_tests in 4 parallel gtest shards beside the other tests (tools/dev/ci-test.sh); same cases, less wall time.
        bash tools/dev/ci-test.sh build 4
