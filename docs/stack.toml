[project]
title = "Vaulthalla"
description = "The final cloud: sovereign, encrypted storage on hardware you own. A native C++ daemon encrypts every file before it reaches a disk or a bucket, enforces one set of permissions across the web console, the vh CLI, an S3-compatible gateway and a FUSE filesystem mount, and syncs vaults to S3-compatible providers under cost limits you set."

