# Shipped migration checksums for deploy/psql/*.sql.
#
# sha256 of the raw file bytes, exactly what SqlDeployer (core/seed/include/SqlDeployer.hpp) records in
# schema_migrations.sha256. Enforced by tools/contracts/test_migration_checksums_contract.py.
#
# Format: <status> <sha256> <filename> <note>
#   current     the hash of the file as it is in this tree (exactly one per deploy/psql/*.sql file)
#   historical  a hash a released tag shipped for a file whose content later changed. Each one must also be in
#               kHistoricalMigrationChecksums in SqlDeployer.hpp, with a forward migration that owns the delta.
#
# Update procedure:
#   - New migration: add a "current" line with note "unreleased" (sha256sum deploy/psql/NNN_name.sql).
#   - Editing a migration that has NOT shipped in any v* tag: update its "current" hash.
#   - After it ships, replace "unreleased" with the first tag (e.g. "v1.7.0+"). The note is informational.
#   - NEVER edit a migration that shipped. Add the next-numbered migration instead. The contract test compares
#     every v* tag's deploy/psql against this file when tags are available, so an in-place edit fails unless the
#     old hash is added as "historical" here AND in kHistoricalMigrationChecksums (reviewed, with a forward
#     migration).
