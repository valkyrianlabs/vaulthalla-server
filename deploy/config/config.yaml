#                  VAULTHALLA CONFIGURATION
#                ⚔️  FINAL FORGED EDITION ⚔️
#     A self-hosted empire demands no less than glory
# ═══════════════════════════════════════════════════════

# === 💻 Websocket Server ===
# The websocket server handles real-time communication between the frontend and backend,
# using low-latency sockets and a command protocol to support interactive features,
# including file uploads, notifications, and other interactive features.
websocket_server:
  enabled: true
  host: 127.0.0.1              # loopback: browsers reach /ws through nginx; set 0.0.0.0 only for direct exposure
  port: 36969
  max_connections: 1024        # Concurrent console/share sockets; more are refused with 503 until one closes
  max_upload_size_mb: 2048


# === 🖼️ HTTP Previews ===
# The HTTP preview server serves file previews and thumbnails,
# allowing users to view files directly in their browsers without downloading them.
http_preview_server:
  enabled: true
  host: 127.0.0.1              # loopback: nginx proxies /preview, /download and /upload
  port: 36970
  max_connections: 512         # Concurrent connections (one thread each); more are refused with 503 + Retry-After
  max_preview_size_mb: 512


# === 🖥️ Device listener (Vaulthalla Desktop) ===
# Mutual TLS for paired devices (self-signed certificates, pinned on both sides; no browser, nginx or cookie
# involved). Loopback only until `vh device remote enable` opens it to every interface; that switch is saved here
# as `remote`.
device_server:
  enabled: true
  port: 36972
  remote: false
  max_connections: 256         # Concurrent device connections; more are refused until one closes


# === 🪣 S3-Compatible Gateway ===
# Disabled by default. When enabled, exposes Vaulthalla vaults as S3-compatible
# buckets on an independent Watchdog-supervised runtime service.
s3_gateway:
  enabled: false
  host: 0.0.0.0
  port: 39000
  max_connections: 1024
  max_body_size_mb: 5120
  require_sigv4: true
  allow_path_style: true
  allow_virtual_hosted_style: true
  default_bucket_mode: local          # local | remote_cache | remote_proxy
  default_api_exclusive: true
  multipart:
    min_part_size_mb: 5
    abort_after_days: 7
  synthetic_local_request_cost_usd:
    list: "0.00000001"
    head: "0.00000001"
    get: "0.00000001"
    put: "0.00000001"
    delete: "0.00000001"
    copy: "0.00000001"
    downloaded_gb: "0.00000000"
    uploaded_gb: "0.00000000"


# === 🗄️ DATABASE SETTINGS ===
# 🔑 Password is TPM encrypted.
# It is optionally auto-generated and set on first run.
# Alternatively, it can be manually set, export, or regenerated using the `vaulthalla` CLI tool as the super-admin user.
database:
  host: localhost              # PostgreSQL host
  port: 5432                   # PostgreSQL port
  name: vaulthalla             # Database name
  user: vaulthalla             # Database user
  pool_size: 10                # Max DB connection pool size


# === 🔐 AUTHENTICATION SETTINGS ===
# Authentication is handled via JWT tokens.
# Access tokens have a short TTL, while refresh tokens last longer.
# Users can refresh their access tokens using valid refresh tokens.
# This setup balances security and usability.
auth:
  access_token_expiry_minutes: 60          # JWT access token TTL
  refresh_token_expiry_days: 7      # Refresh token TTL


# === 🔃 SYNC SETTINGS ===
# Sync settings manage how often the system checks for changes in the vault and updates file metadata.
sync:
  event_audit_retention_days: 30          # Retain database events/conflicts for this many days, minimum 7 days
  event_audit_max_entries: 5000           # Max number of database events/conflicts to retain, minimum 1000


# === 💸 PRICING ESTIMATES ===
# Uses signed storage-rate artifacts for local S3 request/tier-aware estimates.
# Price-budget enforcement is opt-in through explicit report/warn/enforce policies.
# Catalog lookup remains local by default, and enforcement fails closed when a
# policy requires verified or fresh catalog data that is not available.
# Remote artifact refresh is disabled by default so a fresh install does not
# call upstream price services unless the operator opts in.
pricing:
  enabled: true
  storage_rates_api:
    remote_refresh_enabled: false
    base_url: https://storage-rates-api.vaulthalla.cloud
    timeout_ms: 5000
    cache_ttl_seconds: 43200
    refresh_interval_seconds: 43200
    fail_open: true
    signature_warning_only: true
    signature_public_key_path:
    fallback_artifact_base_urls: []
    prefer_full_catalog: true
    use_remote_estimator_for_debug: false


# === ⚙️ SERVICE SETTINGS ===
# Service settings manage background tasks like database sweeping.
services:
  db_sweeper:
    sweep_interval_minutes: 60             # Interval for sweeping old database events/conflicts, minimum 5 minutes
  connection_lifecycle_manager:
    idle_timeout_minutes: 30              # Timeout for idle connections, minimum 5 minutes
    unauthenticated_timeout_seconds: 60  # Timeout for unauthenticated connections, minimum 30 seconds
    sweep_interval_seconds: 60           # Interval for sweeping idle connections, minimum 15 seconds


# === 📈 STATS SNAPSHOTS ===
# Historical dashboard snapshots are collected in the background for trend cards.
# They do not mutate runtime state and are safe to disable in tiny deployments.
stats_snapshots:
  enabled: true
  runtime_interval_seconds: 60        # Persisted runtime/cache/FUSE/DB sample window, fixed at 60 seconds
  gauge_observation_interval_seconds: 3 # Runtime-only gauge observation tick, minimum 1 second
  vault_interval_seconds: 3600        # Vault capacity/sync/activity snapshots, minimum 300 seconds
  retention_days: 30                  # Delete historical snapshots older than this, minimum 1 day


# === 🤝 SHARING SETTINGS ===
# Share links let users hand out files and folders. Turning a switch off refuses new links of that kind
# and stops existing ones from opening or serving files (they come back when it is turned on again).
# Older configs call enable_email_validated enable_public_links; that name is still read.
sharing:
  enabled: true                # Master switch for all share links
  enable_anonymous: true       # Links anyone with the URL can open
  enable_email_validated: true # Links that require the recipient to verify an invited email address


# === 🗃️ VAULTS: DEFAULTS, DELETION & RETENTION ===
# Defaults for new vaults: a vault created without an explicit setting gets these; existing vaults keep theirs.
# Older configs keep the two default_remote_* keys under s3_gateway; that location is still read.
#
# Deleting a vault schedules its removal. It disappears at once (listings, the mount, shares, sync, the S3 gateway)
# and can be restored with `vh vault restore` until retention_window ends; then its local data is removed, and its
# upstream bucket data too when that was chosen at delete time. The vault's sealed encryption key is kept for the
# full key retention window even after "delete now", so encrypted copies elsewhere stay recoverable with
# `vh vault keys export`. Durations: s, m, h, d or w (e.g. 5m, 90d). Changes apply to vaults deleted afterwards.
vaults:
  retention_window: 5m           # Restore window before a deleted vault's data is purged
  tpm_retention_window: 90d      # How long a deleted vault's encryption key is kept
  s3:
    default_remote_sync_strategy: cache        # cache (index the bucket, fetch files on demand) | sync | mirror
    default_remote_conflict_policy: ask        # ask (record it; resolve with `vh sync resolve` or the console) | keep_local | keep_remote | keep_newest
    tpm_retention_window: 180d                 # Key retention for S3-backed vaults (their data may stay upstream)


# === ⚡ Caching & Previews ===
# Caching improves performance by storing frequently accessed files and thumbnails.
# The cache size and thumbnail settings can be adjusted based on server capacity and user needs.
caching:
  max_size_mb: 10240                          # Max size for full-size cache (10 GB)
  thumbnails:
    formats: [jpg, jpeg, png, webp, pdf]
    sizes: [128, 256, 512]                    # Thumbnail sizes in pixels
    expiry_days: 30


# === 🎞️ Rich previews ===
